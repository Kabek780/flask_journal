{% extends 'base.html' %}

{% block content %}
    <h2>Вход</h2>
    <form method="post">
        {{ form.hidden_tag() }}
        {{ form.username.label }} {{ form.username(size=32) }} <br>
        {{ form.password.label }} {{ form.password(size=32) }} <br>
        {{ form.submit(class="btn btn-primary") }}
    </form>
    <p>Нет аккаунта? <a href="{{ url_for('register') }}">Зарегистрироваться</a></p>
{% endblock %}
